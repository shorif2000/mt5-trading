# Weekly refresh of the exchange holiday reference file (config/exchange_holidays.yaml).
#
# Proposes changes as a pull request for review; never merges and never pushes to main.
# No pull request is opened when nothing changed. The job fails (so it is visible) when a
# source could not be read or a conflict needs a reviewer, but the last known good file is
# kept in every case. The application never contacts these sources at runtime.
name: Update exchange holidays

on:
  schedule:
    - cron: "23 6 * * 1" # Mondays 06:23 UTC
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: update-exchange-holidays
  cancel-in-progress: false

jobs:
  update:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    permissions:
      contents: write # push the proposal branch
      pull-requests: write # open or update the proposal pull request
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - uses: astral-sh/setup-uv@68559e99cc807c1eb7e9238fd43a15bba460eec2 # v10.3.3

      - name: Install locked dependencies
        run: uv sync --locked

      - name: Fetch official calendars and compare with the local file
        id: update
        run: |
          set +e
          uv run mt5-calendar-update --report "$RUNNER_TEMP/calendar-report.md"
          echo "exit_code=$?" >> "$GITHUB_OUTPUT"

      - name: Validate the proposed calendar with the test suite
        if: steps.update.outputs.exit_code != '2'
        run: uv run pytest

      - name: Open or update a pull request when the file changed
        if: steps.update.outputs.exit_code != '2'
        uses: peter-evans/create-pull-request@3ffccacd46053766916f087ce41d627c0b8cf2d1 # v8.1.3
        with:
          branch: automation/exchange-holidays
          delete-branch: true
          add-paths: config/exchange_holidays.yaml
          commit-message: Update exchange holiday reference calendar
          title: Update exchange holiday reference calendar
          body-path: ${{ runner.temp }}/calendar-report.md

      - name: Fail when a source failed or a conflict needs review
        if: steps.update.outputs.exit_code != '0'
        run: |
          cat "$RUNNER_TEMP/calendar-report.md" || true
          echo "::error::Calendar update needs attention (exit code ${{ steps.update.outputs.exit_code }})"
          exit 1
