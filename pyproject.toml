[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mt5-trading-research"
version = "0.1.0"
description = "Read-only intraday forex and gold trading research"
requires-python = ">=3.11"
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0,<7",
    "typer>=0.12,<1",
    "rich>=13.7,<15",
    "mcp>=2.3,<3",
    "truststore>=0.10,<1",
]

[project.scripts]
mt5-trading = "trading.main:app"
mt5-calendar-update = "trading.market_data.exchange_holidays:main"

[dependency-groups]
dev = [
    "pytest>=8.0,<10",
    "pytest-cov>=5.0,<7",
    "ruff>=0.5,<1",
    "mypy>=1.10,<2",
    "types-pyyaml>=6.0,<7",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
addopts = "-q"

[tool.ruff]
line-length = 100
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]

[tool.ruff.lint.flake8-bugbear]
# Typer declares CLI parameters through these calls in argument defaults.
extend-immutable-calls = ["typer.Option", "typer.Argument"]

[tool.mypy]
python_version = "3.11"
strict = true
mypy_path = "src"
